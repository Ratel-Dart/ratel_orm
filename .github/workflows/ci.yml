name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ratel
          POSTGRES_PASSWORD: ratel
          POSTGRES_DB: ratel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: ratel_orm

      - uses: actions/checkout@v4
        with:
          repository: Ratel-Dart/Ratel
          ref: develop
          path: ratel

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - name: Install dependencies
        run: dart pub get
        working-directory: ratel_orm

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: ratel_orm

      - name: Analyze
        run: dart analyze
        working-directory: ratel_orm

      - name: Test
        run: dart test
        working-directory: ratel_orm
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ratel_test
          DB_USER: ratel
          DB_PASSWORD: ratel
          DB_SSL_MODE: disable

      - name: Install the hygiene checker from Ratel
        run: dart pub get
        working-directory: ratel

      - name: Check hygiene
        run: dart run tool/hygiene/bin/check.dart ../ratel_orm
        working-directory: ratel
